<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>皿の反射</title>
<style>
:root { color-scheme: dark; font: 15px/1.4 system-ui, sans-serif; background: #000; color: #f7efe6; }
body { margin: 0; overflow: hidden; }
main { position: relative; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; }
canvas {
  position: absolute; inset: 0 auto 0 50%; transform: translateX(-50%);
  display: block; width: max(100vw, min(170vw, 167.54vh)); width: max(100vw, min(170vw, 167.54dvh));
  height: 100%; touch-action: none; cursor: move;
}
#status { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); margin: 0; text-align: center; }
#controls {
  position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center;
  gap: .55rem; border: 0; margin: 0; padding: .5rem .75rem max(.75rem, env(safe-area-inset-bottom));
  pointer-events: none;
}
button {
  pointer-events: auto; min-height: 44px; border: 1px solid #4b4945; border-radius: 999px;
  background: #191816ec; color: inherit; padding: .45rem .85rem; font: inherit; cursor: pointer;
}
#motion::before { display: inline-block; width: .48rem; height: .48rem; margin-right: .45rem; border-radius: 50%; background: #a19b92; content: ""; }
#motion[data-state="running"]::before { background: #8ddd9d; }
#motion[data-state="waiting"]::before { background: #f3b565; }
button:disabled { opacity: .55; }
:focus-visible { outline: 2px solid #ffd19a; outline-offset: 2px; }
@media (min-aspect-ratio: 1/1) {
  #controls { justify-content: flex-end; padding-right: max(.75rem, env(safe-area-inset-right)); }
}
</style>
</head>
<body>
<main>
  <canvas id="plate" aria-label="皿の反射。ドラッグや矢印キーで照明を動かせます" tabindex="0"></canvas>
  <p id="status" role="status">読み込み中…</p>
  <fieldset id="controls" aria-label="照明操作" disabled>
    <button type="button" id="motion" data-state="idle" aria-pressed="false" aria-live="polite">センサーを使う</button>
    <button type="button" id="reset" aria-label="今の向きを照明の基準にする">基準に戻す</button>
  </fieldset>
</main>
<script>
const canvas = document.querySelector('#plate');
const controls = document.querySelector('#controls');
const motionButton = document.querySelector('#motion');
const statusText = document.querySelector('#status');
const tiltLimit = 24;
let instance;
let drag = null;
let manualX = 0;
let manualY = 0;
let motionEnabled = false;
let motionReceived = false;
let motionTimer;
let lastPoseTime = -Infinity;
function call(method, value) {
  if (!instance) return;
  if (value === undefined) instance.SendMessage('PlateLightStudy', method);
  else instance.SendMessage('PlateLightStudy', method, value);
}
function setManual(x, y) {
  const clamp = value => Math.max(-tiltLimit, Math.min(tiltLimit, value));
  manualX = clamp(x);
  manualY = clamp(y);
  call('SetManualTilt', JSON.stringify({x: manualX, y: manualY}));
}
function setSensorState(state, text) {
  motionButton.dataset.state = state;
  motionButton.textContent = text;
  motionButton.setAttribute('aria-pressed', String(motionEnabled));
}
function stopMotion() {
  if (!motionEnabled) return;
  window.removeEventListener('deviceorientation', onPose);
  clearTimeout(motionTimer);
  motionEnabled = false;
  setSensorState('idle', 'センサーを使う');
}
function onPose(event) {
  if (!Number.isFinite(event.beta) || !Number.isFinite(event.gamma)) return;
  if (!motionReceived) {
    motionReceived = true;
    setSensorState('running', 'センサー動作中');
    clearTimeout(motionTimer);
  }
  const time = performance.now();
  if (time - lastPoseTime < 32) return;
  lastPoseTime = time;
  call('SetPhonePose', JSON.stringify({
    alpha: Number.isFinite(event.alpha) ? event.alpha : 0,
    beta: event.beta,
    gamma: event.gamma,
    screen: window.screen.orientation?.angle ?? window.orientation ?? 0
  }));
}
motionButton.addEventListener('click', async () => {
  if (motionEnabled) {
    stopMotion();
    setManual(0, 0);
    return;
  }
  motionButton.disabled = true;
  try {
    const sensor = window.DeviceOrientationEvent;
    if (!sensor || !window.isSecureContext) {
      setSensorState('idle', 'センサー非対応');
      return;
    }
    if (typeof sensor.requestPermission === 'function' && await sensor.requestPermission() !== 'granted') {
      setSensorState('idle', 'センサー未許可');
      return;
    }
    setManual(0, 0);
    call('BeginMotion');
    motionEnabled = true;
    motionReceived = false;
    lastPoseTime = -Infinity;
    window.addEventListener('deviceorientation', onPose);
    setSensorState('waiting', 'センサー待機中');
    motionTimer = setTimeout(() => {
      if (!motionReceived) setSensorState('idle', 'センサー未検出');
    }, 2500);
  } catch (_) {
    setSensorState('idle', 'センサー非対応');
  } finally {
    motionButton.disabled = false;
  }
});
document.querySelector('#reset').addEventListener('click', () => {
  if (motionEnabled) call('ResetTilt');
  else setManual(0, 0);
});
canvas.addEventListener('pointerdown', event => {
  if (!instance || !event.isPrimary || event.button !== 0 || motionEnabled) return;
  canvas.setPointerCapture(event.pointerId);
  drag = {id: event.pointerId, x: event.clientX, y: event.clientY, startX: manualX, startY: manualY};
});
canvas.addEventListener('pointermove', event => {
  if (drag?.id !== event.pointerId) return;
  const sensitivity = 2 * tiltLimit / Math.min(innerWidth, innerHeight);
  setManual(drag.startX + sensitivity*(event.clientX-drag.x),
    drag.startY + sensitivity*(drag.y-event.clientY));
});
for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  canvas.addEventListener(type, () => { drag = null; });
}
canvas.addEventListener('keydown', event => {
  if (!instance || motionEnabled) return;
  const delta = {ArrowLeft: [-2,0], ArrowRight: [2,0], ArrowUp: [0,2], ArrowDown: [0,-2]}[event.key];
  if (!delta) return;
  event.preventDefault();
  setManual(manualX + delta[0], manualY + delta[1]);
});
const build = 'Build/';
const buildVersion = '1.3';
const versioned = file => build + file + '?v=' + buildVersion;
const loader = document.createElement('script');
loader.src = versioned('plate-light-study.loader.js');
const failed = () => { statusText.textContent = 'Unity Web を起動できませんでした。'; };
loader.onerror = failed;
loader.onload = () => {
  createUnityInstance(canvas, {
    dataUrl: versioned('plate-light-study.data.unityweb'),
    frameworkUrl: versioned('plate-light-study.framework.js.unityweb'),
    codeUrl: versioned('plate-light-study.wasm.unityweb'),
    productName: 'Plate Light Study',
    productVersion: buildVersion,
    companyName: 'Local Sky Lighting',
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    showBanner(message, type) {
      if (type === 'error') {
        statusText.hidden = false;
        statusText.textContent = message;
      }
    }
  }, ratio => { statusText.textContent = '読み込み中… ' + Math.round(100*ratio) + '%'; })
    .then(result => {
      instance = result;
      controls.disabled = false;
      statusText.hidden = true;
      setManual(0, 0);
    }).catch(failed);
};
document.body.append(loader);
</script>
</body>
</html>
