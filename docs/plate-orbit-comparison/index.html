<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>皿の反射｜視点移動の比較</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111; color: #eee; }
  body { max-width: 1480px; margin: auto; padding: 24px 16px; }
  h1 { font-size: 1.4rem; margin: 0 0 16px; }
  .views { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  figure { margin: 0; }
  figcaption { margin: 0 0 7px; }
  .frame { overflow: hidden; background: #000; aspect-ratio: 16 / 9; }
  iframe, video { width: 100%; height: 100%; border: 0; display: block; }
  .transport { margin: 16px 0 0; display: flex; align-items: center; gap: 12px; }
  input { flex: 1; min-width: 0; accent-color: #e5b463; }
  output { font-variant-numeric: tabular-nums; min-width: 6ch; }
  button { padding: 7px 14px; }
  p { margin: 10px 0; }
  a { color: #f1c789; }
  @media (max-width: 780px) { .views { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 390px) { .frame { min-height: 200px; } }
</style>
<main>
  <h1>皿の反射｜視点移動の比較</h1>
  <div class="views">
    <figure><figcaption>公式映像 · 0:36〜0:47</figcaption><div class="frame"><div id="reference"></div></div></figure>
    <figure><figcaption><label for="variant">Unity · </label><select id="variant">
      <option value="unity-orbit-tuned.mp4">周回＋反射調整</option>
      <option value="unity-orbit-camera.mp4">周回のみ</option>
      <option value="unity-orbit.mp4">前回の軌道</option>
    </select></figcaption><div class="frame">
      <video id="render" src="unity-orbit-tuned.mp4" poster="orbit-tuned-start.jpg" muted playsinline controls preload="auto"></video>
    </div></figure>
  </div>
  <div class="transport" aria-label="同期再生">
    <button id="toggle" disabled>比較を再生</button>
    <input id="position" aria-label="公式映像の再生時刻" type="range" min="36" max="47" step="0.05" value="36" disabled>
    <output id="time" for="position">0:36.0</output>
  </div>
  <p id="status" role="status">公式プレーヤーを読み込み中</p>
  <p><a href="https://www.youtube.com/watch?v=ejIZGY6yfX4&amp;t=36s">公式映像をYouTubeで開く</a></p>
</main>
<script>
  const start = 36, end = 47;
  const video = document.querySelector('#render');
  const slider = document.querySelector('#position');
  const time = document.querySelector('#time');
  const toggle = document.querySelector('#toggle');
  const status = document.querySelector('#status');
  const variant = document.querySelector('#variant');
  let player, ready = false, seekingUntil = 0;

  variant.addEventListener('change', () => {
    const position = ready ? Math.max(start, Math.min(end, player.getCurrentTime())) : start + video.currentTime;
    if (ready) player.pauseVideo();
    video.pause();
    video.removeAttribute('poster');
    video.src = variant.value;
    video.onloadedmetadata = () => moveRender(position);
  });

  function showTime(value) {
    slider.value = value;
    time.value = '0:' + value.toFixed(1);
  }

  function moveRender(officialTime) {
    if (!Number.isFinite(video.duration)) return;
    video.currentTime = Math.max(0, Math.min(video.duration - 1 / 24, officialTime - start));
  }

  function unavailable() {
    ready = false;
    video.pause();
    video.controls = true;
    toggle.disabled = slider.disabled = true;
    status.textContent = '公式プレーヤーを読み込めません。YouTubeとUnity映像を個別に再生できます。';
  }

  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player('reference', {
      videoId: 'ejIZGY6yfX4',
      playerVars: { start, end, playsinline: 1, origin: location.origin },
      events: {
        onReady() {
          ready = true;
          toggle.disabled = slider.disabled = false;
          video.controls = false;
          status.textContent = '再生位置は公式映像に同期します。';
        },
        onError: unavailable
      }
    });
  };

  toggle.addEventListener('click', () => {
    if (player.getPlayerState() === YT.PlayerState.PLAYING) {
      player.pauseVideo();
      return;
    }
    const elapsed = player.getCurrentTime();
    if (elapsed < start || elapsed >= end - 0.04) {
      moveRender(start);
      player.seekTo(start, true);
    }
    player.playVideo();
  });
  slider.addEventListener('input', () => {
    const next = Number(slider.value);
    seekingUntil = performance.now() + 600;
    showTime(next);
    video.pause();
    moveRender(next);
  });
  slider.addEventListener('change', () => {
    seekingUntil = performance.now() + 600;
    player.seekTo(Math.min(end - 1 / 24, Number(slider.value)), true);
  });

  setInterval(() => {
    if (!ready || performance.now() < seekingUntil) return;
    const officialTime = player.getCurrentTime();
    const state = player.getPlayerState();
    const inRange = officialTime >= start && officialTime < end;
    if (state === YT.PlayerState.PLAYING && !inRange) {
      if (officialTime < start) player.seekTo(start, true);
      else player.pauseVideo();
    }
    const playing = state === YT.PlayerState.PLAYING && inRange;
    toggle.textContent = playing ? '一時停止' : '比較を再生';
    if (playing && video.paused) video.play().catch(() => {});
    if (!playing && !video.paused) video.pause();
    const position = Math.max(start, Math.min(end, officialTime));
    showTime(position);
    if (Math.abs(video.currentTime - (position - start)) > (playing ? 0.18 : 0.05) && !video.seeking) {
      moveRender(position);
    }
  }, 80);
</script>
<script src="https://www.youtube.com/iframe_api" async onerror="unavailable()"></script>
</html>
