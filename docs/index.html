<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Local Sky Lighting</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #181d23; color: #f7eedb; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #status { position: absolute; inset: 45% 20px auto; text-align: center; font: 16px system-ui; }
  </style>
</head>
<body>
  <canvas id="unity-canvas"></canvas>
  <div id="status" role="status">Loading Local Sky Lighting…</div>
  <script src="Build/docs.loader.js"></script>
  <script>
    const loadStatus = document.getElementById('status');
    const canvas = document.getElementById('unity-canvas');
    createUnityInstance(canvas, {
      dataUrl: 'Build/docs.data.unityweb',
      frameworkUrl: 'Build/docs.framework.js.unityweb',
      codeUrl: 'Build/docs.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'Local Sky Lighting',
      productName: 'Local Sky Lighting',
      productVersion: '0.1',
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5)
    }, progress => {
      loadStatus.textContent = 'Loading Local Sky Lighting… ' + Math.round(progress * 100) + '%';
    }).then(() => {
      loadStatus.hidden = true;
    }).catch(error => {
      loadStatus.textContent = 'The Unity demo could not start. ' + error;
    });
  </script>
</body>
</html>
