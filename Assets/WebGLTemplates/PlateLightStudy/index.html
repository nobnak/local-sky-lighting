<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>皿の反射</title>
<style>
:root { color-scheme: dark; font: 15px/1.4 system-ui, sans-serif; background: #000; color: #f7efe6; }
body { margin: 0; overflow: hidden; }
main { position: relative; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; }
canvas {
  position: absolute; inset: 0 auto 0 50%; transform: translateX(-50%);
  display: block; width: max(100vw, min(170vw, 167.54vh)); width: max(100vw, min(170vw, 167.54dvh));
  height: 100%; touch-action: none; cursor: move;
}
#light-size {
  position: absolute; top: max(.75rem, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
  border-radius: 999px; background: #191816ec; padding: .25rem .65rem;
  pointer-events: none; white-space: nowrap;
}
#status { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); margin: 0; text-align: center; }
#controls {
  position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center;
  gap: .55rem; border: 0; margin: 0; padding: .5rem .75rem max(.75rem, env(safe-area-inset-bottom));
  pointer-events: none;
}
button {
  pointer-events: auto; min-height: 44px; border: 1px solid #4b4945; border-radius: 999px;
  background: #191816ec; color: inherit; padding: .45rem .85rem; font: inherit; cursor: pointer;
}
#motion::before { display: inline-block; width: .48rem; height: .48rem; margin-right: .45rem; border-radius: 50%; background: #a19b92; content: ""; }
#motion[data-state="running"]::before { background: #8ddd9d; }
#motion[data-state="waiting"]::before { background: #f3b565; }
button:disabled { opacity: .55; }
:focus-visible { outline: 2px solid #ffd19a; outline-offset: 2px; }
@media (min-aspect-ratio: 1/1) {
  #controls { justify-content: flex-end; padding-right: max(.75rem, env(safe-area-inset-right)); }
}
</style>
</head>
<body>
<main>
  <canvas id="plate" aria-label="皿の反射。ピンチまたはプラス・マイナスキーでスポットライトの照射角を調整。ドラッグまたは矢印キーで照明を操作" tabindex="0"></canvas>
  <output id="light-size" hidden></output>
  <p id="status" role="status">読み込み中…</p>
  <fieldset id="controls" aria-label="照明操作" disabled>
    <button type="button" id="motion" data-state="idle" aria-pressed="false" aria-live="polite">センサーを使う</button>
    <button type="button" id="reset" aria-label="今の傾きと向きを基準にする">基準に戻す</button>
  </fieldset>
</main>
<script>
const canvas = document.querySelector('#plate');
const controls = document.querySelector('#controls');
const motionButton = document.querySelector('#motion');
const statusText = document.querySelector('#status');
const sizeLabel = document.querySelector('#light-size');
const sensor = window.isSecureContext ? window.DeviceOrientationEvent : undefined;
const needsSensorGesture = typeof sensor?.requestPermission === 'function';
const tiltLimit = 24;
const projectionSizes = [100, 66, 26];
const pinchStep = 1.25;
const touches = new Map();
let instance;
let drag = null;
let manualX = 0;
let manualY = 0;
let motionListening = false;
let lighting = 0;
let sizeTimer;
let pinchDistance = 0;
let motionReceived = false;
let motionTimer;
let lastPoseTime = -Infinity;
let headingTracking = null;
let lastAlpha = 0;
let alphaOffset = 0;
function call(method, value) {
  if (!instance) return;
  if (value === undefined) instance.SendMessage('PlateLightStudy', method);
  else instance.SendMessage('PlateLightStudy', method, value);
}
function setManual(x, y) {
  const clamp = value => Math.max(-tiltLimit, Math.min(tiltLimit, value));
  manualX = clamp(x);
  manualY = clamp(y);
  call('SetManualTilt', JSON.stringify({x: manualX, y: manualY}));
}
function setSensorState(state, text) {
  motionButton.dataset.state = state;
  motionButton.textContent = text;
  motionButton.setAttribute('aria-pressed', String(motionReceived));
}
function startMotion(offerPermission = false) {
  if (!sensor) {
    setSensorState('idle', 'センサー非対応');
    return;
  }
  motionListening = true;
  window.addEventListener('deviceorientation', onPose);
  clearTimeout(motionTimer);
  setSensorState('waiting', offerPermission ? 'センサーを許可' : 'センサー待機中');
  motionTimer = setTimeout(() => {
    setSensorState('idle', offerPermission ? 'センサーを許可' : 'センサー未検出');
  }, 2500);
}
function stopMotion() {
  window.removeEventListener('deviceorientation', onPose);
  clearTimeout(motionTimer);
  motionListening = false;
  motionReceived = false;
}
function onPose(event) {
  if (!Number.isFinite(event.beta) || !Number.isFinite(event.gamma)) return;
  if (!motionReceived) {
    motionReceived = true;
    drag = null;
    lastPoseTime = -Infinity;
    headingTracking = null;
    lastAlpha = alphaOffset = 0;
    call('BeginMotion');
    clearTimeout(motionTimer);
  }
  const time = performance.now();
  if (time - lastPoseTime < 32) return;
  lastPoseTime = time;
  const hasHeading = Number.isFinite(event.alpha);
  if (hasHeading && headingTracking === false) alphaOffset = lastAlpha - event.alpha;
  if (hasHeading) lastAlpha = event.alpha + alphaOffset;
  if (headingTracking !== hasHeading) {
    headingTracking = hasHeading;
    setSensorState('running', hasHeading ? 'センサー動作中' : '傾きのみ動作中');
  }
  call('SetPhonePose', JSON.stringify({
    alpha: lastAlpha,
    headingUnavailable: !hasHeading,
    beta: event.beta,
    gamma: event.gamma,
    screen: window.screen.orientation?.angle ?? window.orientation ?? 0
  }));
}
motionButton.addEventListener('click', async () => {
  if (motionReceived) {
    stopMotion();
    call('BeginMotion');
    setSensorState('idle', 'センサーを使う');
    setManual(0, 0);
    return;
  }
  if (!needsSensorGesture) {
    if (!motionListening) startMotion();
    return;
  }
  motionButton.disabled = true;
  try {
    if (await sensor.requestPermission() === 'granted') {
      if (!motionReceived) startMotion();
    } else {
      stopMotion();
      setSensorState('idle', 'センサー未許可');
    }
  } catch (_) {
    stopMotion();
    setSensorState('idle', 'センサー未許可');
  } finally {
    motionButton.disabled = false;
  }
});
document.querySelector('#reset').addEventListener('click', () => {
  if (motionReceived) call('ResetTilt');
  else setManual(0, 0);
});
function changeLightSize(step) {
  const next = Math.max(0, Math.min(projectionSizes.length - 1, lighting + step));
  if (next === lighting) return;
  lighting = next;
  call('SetReferencePhase', -1);
  call('SetLighting', lighting);
  sizeLabel.textContent = '照射サイズ ' + projectionSizes[lighting] + '%';
  sizeLabel.hidden = false;
  clearTimeout(sizeTimer);
  sizeTimer = setTimeout(() => { sizeLabel.hidden = true; }, 1000);
}
function touchDistance() {
  const [a, b] = touches.values();
  return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
}
canvas.addEventListener('pointerdown', event => {
  if (!instance || event.button !== 0) return;
  canvas.setPointerCapture(event.pointerId);
  if (event.pointerType === 'touch') {
    touches.set(event.pointerId, event);
    if (touches.size > 1) {
      drag = null;
      pinchDistance = touches.size === 2 ? touchDistance() : 0;
      return;
    }
  }
  if (!motionReceived && event.isPrimary) {
    drag = {id: event.pointerId, x: event.clientX, y: event.clientY, startX: manualX, startY: manualY};
  }
});
canvas.addEventListener('pointermove', event => {
  if (touches.has(event.pointerId)) {
    touches.set(event.pointerId, event);
    if (touches.size > 1) {
      if (touches.size !== 2) return;
      const distance = touchDistance();
      if (!pinchDistance || distance <= pinchDistance / pinchStep || distance >= pinchDistance * pinchStep) {
        if (pinchDistance) changeLightSize(distance < pinchDistance ? 1 : -1);
        pinchDistance = distance;
      }
      return;
    }
  }
  if (drag?.id !== event.pointerId) return;
  const sensitivity = 2 * tiltLimit / Math.min(innerWidth, innerHeight);
  setManual(drag.startX + sensitivity*(event.clientX-drag.x),
    drag.startY + sensitivity*(drag.y-event.clientY));
});
for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  canvas.addEventListener(type, event => {
    if (touches.delete(event.pointerId)) pinchDistance = touches.size === 2 ? touchDistance() : 0;
    if (drag?.id === event.pointerId) drag = null;
  });
}
canvas.addEventListener('keydown', event => {
  if (!instance) return;
  if (event.key === '+' || event.key === '=' || event.key === '-') {
    event.preventDefault();
    changeLightSize(event.key === '-' ? 1 : -1);
    return;
  }
  if (motionReceived) return;
  const delta = {ArrowLeft: [-2,0], ArrowRight: [2,0], ArrowUp: [0,2], ArrowDown: [0,-2]}[event.key];
  if (!delta) return;
  event.preventDefault();
  setManual(manualX + delta[0], manualY + delta[1]);
});
const build = 'Build/';
const buildVersion = '2.12';
const versioned = file => build + file + '?v=' + buildVersion;
const loader = document.createElement('script');
loader.src = versioned('{{{ LOADER_FILENAME }}}');
const failed = () => { statusText.textContent = 'Unity Web を起動できませんでした。'; };
loader.onerror = failed;
loader.onload = () => {
  createUnityInstance(canvas, {
    dataUrl: versioned('{{{ DATA_FILENAME }}}'),
    frameworkUrl: versioned('{{{ FRAMEWORK_FILENAME }}}'),
    codeUrl: versioned('{{{ CODE_FILENAME }}}'),
    productName: 'Plate Light Study',
    productVersion: buildVersion,
    companyName: 'Local Sky Lighting',
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    showBanner(message, type) {
      if (type === 'error') {
        statusText.hidden = false;
        statusText.textContent = message;
      }
    }
  }, ratio => { statusText.textContent = '読み込み中… ' + Math.round(100*ratio) + '%'; })
    .then(result => {
      instance = result;
      const params = new URLSearchParams(location.search);
      if (params.get('bloom') === '0') call('SetBloom', 0);
      const phase = params.get('phase');
      if (phase === 'cycle') call('SetReferencePhase', 0);
      else if (['4', '9', '14'].includes(phase)) call('SetReferencePhase', Number(phase));
      controls.disabled = false;
      statusText.hidden = true;
      startMotion(needsSensorGesture);
    }).catch(failed);
};
document.body.append(loader);
</script>
</body>
</html>
